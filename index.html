<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Identity - Quest 3S Edition</title>
  <!-- Import A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Import custom logic -->
  <script type="module" src="/src/app.js"></script>
  <!-- Import mobile UI styles -->
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <!-- UI Layer for DOM Overlay -->
  <div id="ui-layer">
    <div id="mode-selector">
      <button id="btn-assist" class="active">Assist Mode</button>
      <button id="btn-prod">Productivity Mode</button>
    </div>

    <div id="tool-selector">
      <!-- Assist Mode Tools -->
      <div id="assist-tools" class="tool-group">
        <button data-item="xray">X-Ray Cabinet</button>
        <button data-item="allergen">Allergen Shield</button>
        <button data-item="badge">Photo Badge</button>
      </div>
      <!-- Productivity Mode Tools -->
      <div id="prod-tools" class="tool-group hidden">
        <button data-item="freshness">Freshness Tracker</button>
        <button data-item="fridge-index">Fridge Index</button>
        <button data-item="pointer">Memory Pointer</button>
      </div>
    </div>
    
    <div style="display: flex; justify-content: center; padding-bottom: 10px;">
      <button id="btn-clear" style="background-color: #e74c3c; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">Clear Room</button>
    </div>
    <div id="instructions">Tap to place item</div>
  </div>

  <!-- A-Frame Scene with AR capabilities and DOM overlay -->
  <a-scene webxr="optionalFeatures: hit-test, local-floor, dom-overlay; overlayElement: #ui-layer;"
    background="color: transparent" renderer="alpha: true;">

    <!-- Camera rig -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera position="0 0 0" look-controls="pointerLockEnabled: false"></a-camera>

      <!-- Hand Tracking / Controllers for Meta Quest 3S -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>
    </a-entity>

    <!-- Tap to place system -->
    <a-entity id="placement-manager"></a-entity>

    <!-- Basic lighting to illuminate objects -->
    <a-light type="ambient" color="#888"></a-light>
    <a-light type="directional" position="-1 2 1" intensity="0.8"></a-light>
  </a-scene>
</body>

</html>
